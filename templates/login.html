{% extends "base.html" %}

{% block title %}Login - SkillForge{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <div class="bg-amber text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 50px; height: 50px; background-color: var(--primary);">
                    <i class="fa-solid fa-lock fa-lg"></i>
                </div>
                <h3 class="fw-bold text-dark">Welcome Back</h3>
                <p class="text-muted small">Sign in to your SkillForge account</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="student@university.edu" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Sign In</button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="small text-muted mb-0">Don't have an account yet? <a href="{{ url_for('register') }}" class="fw-bold text-amber text-decoration-none">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
